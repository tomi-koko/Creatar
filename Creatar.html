<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>可视化森林知识系统 V6.1</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --creation-color: #ff9a9e; --practice-color: #2196F3; --refine-color: #4CAF50;
            --bg-color: #f0f2f5; --locked-color: #e0e4e8; --card-bg: #ffffff; 
            --text-color: #2c3e50; --toolbar-bg: #ffffff; --link-color: #ccc;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a; --locked-color: #333333; --card-bg: #2d2d2d; 
            --text-color: #ecf0f1; --toolbar-bg: #252525; --link-color: #555;
        }
        [data-theme="dark"] button.active { background: #ecf0f1 !important; color: #1a1a1a !important; border-color: #fff; }
        
        body { margin: 0; font-family: "PingFang SC", sans-serif; background: var(--bg-color); overflow: hidden; color: var(--text-color); transition: background 0.3s; }

        #toolbar {
            position: absolute; top: 0; width: 100%; height: 65px;
            background: var(--toolbar-bg); display: flex; align-items: center; padding: 0 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1); z-index: 100; gap: 8px; box-sizing: border-box;
            user-select: none; border-bottom: 1px solid var(--link-color);
        }
        .search-container { display: flex; align-items: center; gap: 5px; background: rgba(128,128,128,0.1); padding: 5px 10px; border-radius: 20px; }
        .search-box { border: none; background: transparent; outline: none; color: inherit; width: 120px; }
        /* 1. 基础指针设置 */
        .btn-ui g, .cb-ui { cursor: pointer; }

        /* 2. 按钮背景悬停变色（变深一点） */
        .btn-ui g:hover rect {
            fill: rgba(128, 128, 128, 0.4);
            transition: fill 0.2s;
        }

        /* 3. 复选框悬停变色 */
        .cb-ui:hover rect[stroke="#999"] {
            stroke: #4CAF50;
            transition: stroke 0.2s;
        }
        button, select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--link-color); background: var(--card-bg); color: var(--text-color); cursor: pointer; font-size: 13px; }
        button:hover { filter: brightness(1.1); }
        button.active { background: #333 !important; color: white !important; }
        .btn-seed { background: #673AB7; color: white; border: none; }
        .linking-mode-active { background: #ff9800 !important; color: white !important; animation: pulse 1.5s infinite; }

        /* 呼吸灯动画：搜索高亮（黄/橙） */
        @keyframes highlight-glow {
            0% { stroke: #ffeb3b; stroke-width: 2; }
            50% { stroke: #ff9800; stroke-width: 8; }
            100% { stroke: #ffeb3b; stroke-width: 2; }
        }
        /* 呼吸灯动画：连线模式选中（红） */
        @keyframes link-source-glow {
            0% { stroke: #ff4d4f; stroke-width: 2; }
            50% { stroke: #ff4d4f; stroke-width: 10; stroke-opacity: 0.8; }
            100% { stroke: #ff4d4f; stroke-width: 2; }
        }
        
        .search-highlight { animation: highlight-glow 1s ease-in-out 2; stroke-opacity: 1 !important; }
        .link-source-highlight { animation: link-source-glow 1.5s infinite ease-in-out; stroke: #ff4d4f !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        .modal { background: var(--card-bg); color: var(--text-color); padding: 25px; border-radius: 12px; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .modal input, .modal textarea, .modal select {
            width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background: var(--bg-color); color: inherit;
        }
        /* 找到或添加这段 CSS */
        .node-subtext {
            font-size: 10px; /* 从默认大小改为 10px */
            fill: #888;      /* 调淡一点颜色，视觉更和谐 */
            pointer-events: none;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        .link { fill: none; stroke: var(--link-color); stroke-width: 3px; transition: stroke 0.3s; cursor: pointer; }
        .link:hover { stroke: #ff4d4f; stroke-width: 5px; }
        .node-group { cursor: grab; }
        .node-card { stroke-width: 1px; stroke: rgba(0,0,0,0.1); transition: fill 0.3s; }
        .node-locked { opacity: 0.4; filter: grayscale(0.8); }
        .node-label { font-size: 14px; font-weight: bold; pointer-events: none; fill: var(--text-color); }
    </style>
</head>
<body>

<div id="toolbar">
    <select id="category-select" onchange="switchForest()"></select>
    <button onclick="renameCategory()">命名空间</button>
    <button class="btn-danger" onclick="deleteCurrentCategory()" style="color: #ff4d4f;">删除空间</button>
    <button onclick="addNewCategory()">添加空间</button>
    <button class="btn-seed" onclick="openModal(null, null, 'seed')">+ 初始节点</button>
    <button id="link-tool" onclick="toggleLinkMode()" title="开启后：左键点击两张卡片连线，右键点击线条删除">🔗 连线模式</button>
    
    <div style="flex-grow:1"></div>
    
    <div class="search-container">
        <input type="text" class="search-box" id="search-input" placeholder="跨森林搜索..." onkeypress="if(event.key==='Enter') handleSearch()">
        <span id="search-count" style="font-size: 11px; color: #999;">0/0</span>
        <button style="padding:2px 5px" onclick="jumpSearch(-1)">↑</button>
        <button style="padding:2px 5px" onclick="jumpSearch(1)">↓</button>
    </div>

    <button onclick="toggleTheme()" id="theme-btn">🌙 模式</button>
    <button id="hide-btn" onclick="toggleHideCompleted()">隐藏已完成</button>
    <button onclick="exportJSON()">导出</button>
    <button onclick="document.getElementById('import-input').click()">导入</button>
    <input type="file" id="import-input" style="display:none" onchange="importJSON(event)">
</div>

<div id="modal-overlay">
    <div class="modal">
        <h3 id="modal-header">编辑节点</h3>
        <input type="text" id="node-name" placeholder="名称">
        <select id="node-type">
            <option value="creation">创作 (红色)</option>
            <option value="practice">练习 (蓝色)</option>
            <option value="refine">整理 (绿色)</option>
        </select>
        <input type="date" id="node-deadline">
        <textarea id="node-memo" rows="3" placeholder="备注..."></textarea>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="closeModal()">取消</button>
            <button class="active" onclick="saveNode()">保存</button>
        </div>
    </div>
</div>

<div id="canvas-container"></div>

<script>
    const STORAGE_KEY_DATA = 'forest_v6_data';
    const STORAGE_KEY_CATS = 'forest_v6_cats';
    const STORAGE_KEY_THEME = 'forest_v6_theme';

    let categories = JSON.parse(localStorage.getItem(STORAGE_KEY_CATS)) || ["历史", "书法"];
    let data = JSON.parse(localStorage.getItem(STORAGE_KEY_DATA)) || { nodes: [], links: [] };
    let currentTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
    
    let currentCategory = categories[0];
    let isHidingCompleted = false;
    let editingNodeId = null;
    let pendingRel = null;
    let isLinkingMode = false;
    let linkSource = null;
    let searchResults = [];
    let searchIndex = -1;

    const cardW = 180, cardH = 100;
    const svg = d3.select("#canvas-container").append("svg").attr("width", "100%").attr("height", "100%");
    const g = svg.append("g");
    const zoom = d3.zoom().scaleExtent([0.1, 5]).on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    document.documentElement.setAttribute('data-theme', currentTheme);

    function autoSave() {
        localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(data));
        localStorage.setItem(STORAGE_KEY_CATS, JSON.stringify(categories));
        localStorage.setItem(STORAGE_KEY_THEME, currentTheme);
    }

    function isUnlocked(nodeId) {
        const preLinks = data.links.filter(l => l.target === nodeId);
        if (preLinks.length === 0) return true;
        return preLinks.every(l => {
            const preNode = data.nodes.find(n => n.id === l.source);
            return preNode ? preNode.completed : true;
        });
    }

    function render() {
        updateCategoryUI();
        document.getElementById("hide-btn").classList.toggle("active", isHidingCompleted);
        document.getElementById("theme-btn").innerText = currentTheme === 'light' ? '🌙' : '☀️';

        const visibleNodes = data.nodes.filter(n => 
            n.category === currentCategory && (!isHidingCompleted || !n.completed)
        );
        const nodeIds = new Set(visibleNodes.map(n => n.id));
        const visibleLinks = data.links.filter(l => nodeIds.has(l.source) && nodeIds.has(l.target));

        // --- 连线渲染 ---
        const link = g.selectAll(".link").data(visibleLinks, d => d.source + "-" + d.target);
        link.exit().remove();
        link.enter().append("path").attr("class", "link")
            .on("click", (e, d) => { // 右键逻辑
                // e.preventDefault();
                e.stopPropagation();
                if(isLinkingMode) handleLinkDelete(d);
            })
            .merge(link)
            .attr("d", d => {
                const s = data.nodes.find(n => n.id === d.source), t = data.nodes.find(n => n.id === d.target);
                const sx = s.x + cardW, sy = s.y + cardH/2, tx = t.x, ty = t.y + cardH/2;
                return `M${sx},${sy} C${sx + (tx - sx) / 2},${sy} ${sx + (tx - sx) / 2},${ty} ${tx},${ty}`;
            });

        // --- 节点渲染 ---
        const node = g.selectAll(".node-group").data(visibleNodes, d => d.id);
        node.exit().remove();
        const nodeEnter = node.enter().append("g").attr("class", "node-group")
            .on("click", (e, d) => handleNodeClick(e, d))
            .call(d3.drag().on("start", function() { d3.select(this).cursor = "grabbing"; })
                          .on("drag", (e, d) => { d.x = e.x; d.y = e.y; updatePositions(); })
                          .on("end", autoSave));

        nodeEnter.append("rect").attr("class", "node-card").attr("width", cardW).attr("height", cardH).attr("rx", 8);
        nodeEnter.append("rect").attr("class", "type-bar").attr("width", 8).attr("height", cardH).attr("rx", 4);
        nodeEnter.append("text").attr("class", "node-label").attr("x", 18).attr("y", 28);
        nodeEnter.append("text").attr("class", "node-subtext d-text").attr("x", 18).attr("y", 42);
        nodeEnter.append("text").attr("class", "node-subtext m-text").attr("x", 18).attr("y", 56);

        const allNodes = g.selectAll(".node-group").merge(nodeEnter);
        allNodes.each(function(d) {
            const unlocked = isUnlocked(d.id);
            const el = d3.select(this);
            
            // 样式处理
            const isSearchTarget = searchResults[searchIndex] && searchResults[searchIndex].id === d.id;
            const isLinkSource = linkSource && linkSource.id === d.id;
            
            el.classed("node-locked", !unlocked && !d.completed);
            el.select(".node-card")
                .classed("search-highlight", isSearchTarget)
                .classed("link-source-highlight", isLinkSource) // 连线呼吸灯
                .attr("fill", "var(--card-bg)");

            // 截断标题防止溢出卡片
            const shortTitle = d.title.length > 11 ? d.title.substring(0, 10) + "..." : d.title;
            el.select(".node-label").text(shortTitle);
            el.select(".d-text").text(d.deadline ? "📅 " + d.deadline : "");
            el.select(".m-text").text(d.memo ? d.memo.substring(0, 15) + "..." : "");
            el.select(".type-bar").attr("fill", d.type==='creation'?'#ff9a9e':(d.type==='practice'?'#2196F3':'#4CAF50'));

            // 按钮UI
            el.selectAll(".btn-ui").remove();
            const btns = el.append("g").attr("class", "btn-ui");
            const makeBtn = (x, y, txt, fn) => {
                //const b = btns.append("g").attr("transform", `translate(${x},${y})`).on("mousedown", (e) => { e.stopPropagation(); fn(e); });
                // 增加 .btn-item 类名，以便 CSS 悬停效果生效
            const b = btns.append("g")
                .attr("class", "btn-item") 
                .attr("transform", `translate(${x},${y})`)
                .on("mousedown", (e) => { 
                    e.stopPropagation(); 
                    fn(e); 
                });
                b.append("rect").attr("width", 30).attr("height", 18).attr("rx", 4).attr("fill", "rgba(128,128,128,0.2)");
                b.append("text").attr("x", 15).attr("y", 12.5).attr("text-anchor","middle").style("font-size","9px").attr("fill","var(--text-color)").text(txt);
            };
            makeBtn(15, 75, "+前", () => openModal(null, d, 'prev'));
            makeBtn(47, 75, "+后", () => openModal(null, d, 'next'));
            makeBtn(79, 75, "编辑", () => openModal(d));
            makeBtn(111, 75, "单删", () => deleteNodeSingle(d));
            makeBtn(143, 75, "级删", () => deleteNodeCascade(d));

            // 复选框
            el.selectAll(".cb-ui").remove();
            const cb = el.append("g").attr("class", "cb-ui").attr("transform", `translate(${cardW-30}, 10)`)
                .on("mousedown", (e) => {
                    e.stopPropagation();
                    if(unlocked || d.completed) { d.completed = !d.completed; render(); autoSave(); }
                    else alert("前置节点未完成");
                });
            cb.append("rect").attr("width", 25).attr("height", 25).attr("fill", "transparent");
            cb.append("rect").attr("x", 4).attr("y", 4).attr("width", 18).attr("height", 18).attr("rx", 4).attr("stroke", "#999").attr("fill", "var(--card-bg)");
            if(d.completed) cb.append("text").attr("x", 7).attr("y", 19).attr("fill", "#4CAF50").style("font-weight","bold").text("✓");
        });
        updatePositions();
    }

    function updatePositions() {
        g.selectAll(".node-group").attr("transform", d => `translate(${d.x},${d.y})`);
        g.selectAll(".link").attr("d", d => {
            const s = data.nodes.find(n => n.id === d.source), t = data.nodes.find(n => n.id === d.target);
            if(!s || !t) return "";
            const sx = s.x + cardW, sy = s.y + cardH/2, tx = t.x, ty = t.y + cardH/2;
            return `M${sx},${sy} C${sx + (tx - sx) / 2},${sy} ${sx + (tx - sx) / 2},${ty} ${tx},${ty}`;
        });
    }

    // --- 连线逻辑模块 ---
    function toggleLinkMode() {
        isLinkingMode = !isLinkingMode;
        linkSource = null;
        document.getElementById("link-tool").classList.toggle("linking-mode-active", isLinkingMode);
        render();
    }

    function handleNodeClick(e, d) {
        if (!isLinkingMode) return;
        if (!linkSource) {
            linkSource = d; // 选中起点，render()会触发呼吸灯
            render();
        } else {
            if (linkSource.id !== d.id) {
                const exists = data.links.some(l => (l.source === linkSource.id && l.target === d.id));
                if (!exists) {
                    data.links.push({ source: linkSource.id, target: d.id });
                    autoSave();
                }
            }
            linkSource = null; // 连线完成，关闭呼吸灯
            render();
        }
    }

    function handleLinkDelete(linkData) {
        const s = data.nodes.find(n => n.id === linkData.source);
        const t = data.nodes.find(n => n.id === linkData.target);
        if(confirm(`确定删除从 [${s.title}] 指向 [${t.title}] 的线段吗？`)) {
            data.links = data.links.filter(l => !(l.source === linkData.source && l.target === linkData.target));
            render();
            autoSave();
        }
    }

    // --- 删除逻辑 ---
    function deleteNodeSingle(d) {
        if(!confirm("确定单点删除？连线将被切断。")) return;
        data.nodes = data.nodes.filter(n => n.id !== d.id);
        data.links = data.links.filter(l => l.source !== d.id && l.target !== d.id);
        render(); autoSave();
    }
    function deleteNodeCascade(d) {
        if(!confirm("确定级联删除？该节点的所有下游依赖（无其他路径）都将被清理。")) return;
        let deletedIds = new Set([d.id]);
        let stack = [d.id];
        while (stack.length > 0) {
            let currId = stack.pop();
            data.links.filter(l => l.source === currId).forEach(link => {
                let targetId = link.target;
                let inLinks = data.links.filter(l => l.target === targetId);
                if (inLinks.every(l => deletedIds.has(l.source))) {
                    if (!deletedIds.has(targetId)) { deletedIds.add(targetId); stack.push(targetId); }
                }
            });
        }
        data.nodes = data.nodes.filter(n => !deletedIds.has(n.id));
        data.links = data.links.filter(l => !deletedIds.has(l.source) && !deletedIds.has(l.target));
        render(); autoSave();
    }

    // --- 搜索模块 ---
    function handleSearch() {
        const val = document.getElementById("search-input").value.toLowerCase();
        if(!val) return;
        searchResults = data.nodes.filter(n => n.title.toLowerCase().includes(val));
        if(searchResults.length > 0) { searchIndex = 0; jumpToResult(); }
    }
    function jumpSearch(dir) {
        if(searchResults.length === 0) return;
        searchIndex = (searchIndex + dir + searchResults.length) % searchResults.length;
        jumpToResult();
    }
    function jumpToResult() {
        const target = searchResults[searchIndex];
        if(target.category !== currentCategory) currentCategory = target.category;
        render();
        document.getElementById("search-count").innerText = `${searchIndex + 1}/${searchResults.length}`;
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2 - target.x - cardW/2, window.innerHeight/2 - target.y - cardH/2).scale(1));
    }

    // --- 基础管理 ---
    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        render(); autoSave();
    }
    function openModal(node = null, relNode = null, direction = null) {
        editingNodeId = node ? node.id : null;
        pendingRel = relNode ? { node: relNode, dir: direction } : (direction === 'seed' ? 'seed' : null);
        document.getElementById("node-name").value = node ? node.title : "";
        document.getElementById("node-deadline").value = node ? node.deadline || "" : "";
        document.getElementById("node-memo").value = node ? node.memo || "" : "";
        document.getElementById("modal-overlay").style.display = "flex";
    }
    function closeModal() { document.getElementById("modal-overlay").style.display = "none"; }
    function saveNode() {
        const title = document.getElementById("node-name").value || "未命名";
        const type = document.getElementById("node-type").value;
        const deadline = document.getElementById("node-deadline").value;
        const memo = document.getElementById("node-memo").value;
        if (editingNodeId) {
            Object.assign(data.nodes.find(x => x.id === editingNodeId), { title, type, deadline, memo });
        } else {
            const newId = "node-" + Date.now();
            let x = 100, y = 300;
            if(pendingRel && pendingRel !== 'seed') {
                x = pendingRel.dir === 'next' ? pendingRel.node.x + 280 : pendingRel.node.x - 280;
                y = pendingRel.node.y + (Math.random()-0.5)*80;
            }
            data.nodes.push({ id: newId, title, type, deadline, memo, completed: false, category: currentCategory, x, y });
            if(pendingRel && pendingRel !== 'seed') {
                data.links.push(pendingRel.dir === 'next' ? {source: pendingRel.node.id, target: newId} : {source: newId, target: pendingRel.node.id});
            }
        }
        render(); closeModal(); autoSave();
    }
    function addNewCategory() {
        const n = prompt("新标签名称:");
        if(n && !categories.includes(n)) { categories.push(n); currentCategory = n; render(); autoSave(); }
    }
    function renameCategory() {
        const n = prompt("重命名空间:", currentCategory);
        if(n && n !== currentCategory) {
            data.nodes.forEach(node => { if(node.category === currentCategory) node.category = n; });
            categories[categories.indexOf(currentCategory)] = n;
            currentCategory = n; render(); autoSave();
        }
    }
    function deleteCurrentCategory() {
        if (categories.length <= 1) return alert("必须保留至少一个空间。");
        if (confirm(`确定删除空间【${currentCategory}】？此操作不可逆！`)) {
            data.nodes = data.nodes.filter(n => n.category !== currentCategory);
            const rIds = new Set(data.nodes.map(n => n.id));
            data.links = data.links.filter(l => rIds.has(l.source) && rIds.has(l.target));
            categories = categories.filter(c => c !== currentCategory);
            currentCategory = categories[0];
            render(); autoSave();
        }
    }
    function updateCategoryUI() {
        document.getElementById("category-select").innerHTML = categories.map(c => `<option value="${c}" ${c === currentCategory ? 'selected' : ''}>${c}</option>`).join('');
    }
    function switchForest() { currentCategory = document.getElementById("category-select").value; render(); }
    function toggleHideCompleted() { isHidingCompleted = !isHidingCompleted; render(); }
    function exportJSON() {
        const blob = new Blob([JSON.stringify({categories, data})], {type: "application/json"});
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `forest_v6.json`; a.click();
    }
    function importJSON(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { const res = JSON.parse(ev.target.result); categories = res.categories; data = res.data; render(); autoSave(); };
        reader.readAsText(e.target.files[0]);
    }

    if (data.nodes.length === 0) {
        data.nodes.push({ id: "seed", title: "起始节点", type: "creation", category: "历史", x: 200, y: 300, completed: false });
    }
    render();
</script>
</body>
</html>
